# Centralized versions for Gradle 9.2 Kotlin DSL templates

[versions]
java = "25"
javafx = "25.0.1"
sqlite = "3.46.0.0"
slf4j = "2.0.17"
javafxPlugin = "0.1.0"
springBoot = "3.3.13"
junit = "5.10.1"
mockito = "5.7.0"
assertj = "3.25.1"
testfx = "4.0.20"
jacoco = "0.8.12"

[libraries]
commons-text = { module = "org.apache.commons:commons-text", version = "1.13.0" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.16" }

# Test dependencies
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.1" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafxPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
jacoco = { id = "jacoco", version = "0.8.12" }